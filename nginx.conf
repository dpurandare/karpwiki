# Load balancer in front of the `gateway` service (06 §5's "load-balanced Gateway tier",
# phase2-tasklist.md step 49). `proxy_pass` targets a variable, not a bare hostname, so
# nginx re-resolves `gateway` through Docker's embedded DNS (127.0.0.11) per the
# `resolver valid=` window instead of caching one container IP for the container's
# lifetime — the standard trick for `docker compose up --scale gateway=N` to actually
# spread traffic across replicas rather than pinning to whichever one nginx resolved at
# startup. No session affinity is configured on purpose: the gateway is stateless (06 §4)
# — rate-limit counters live in shared Redis (step 48), not in-process.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location / {
            set $upstream http://gateway:8000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
