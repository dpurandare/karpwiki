# Shared by all four worker services below — container-network hostnames rather than the
# `localhost` ones `.env`/`.env.example` use for a host-run app talking to these same
# containers via published ports (02 §2's note: every process group must agree on one
# object-store path/URL, which inside the compose network means `minio:9000`, not
# `localhost:9000`). The LLM settings and API key still come from the project `.env`
# Compose auto-loads for `${...}` substitution.
x-worker-env: &worker-env
  KARPWIKI_DATABASE_URL: postgresql+asyncpg://karpwiki:karpwiki@postgres:5432/karpwiki
  KARPWIKI_OBJECT_STORE_URL: s3://karpwiki/objectstore
  AWS_ACCESS_KEY_ID: karpwiki
  AWS_SECRET_ACCESS_KEY: karpwiki-dev-secret
  AWS_ENDPOINT_URL: http://minio:9000
  KARPWIKI_CELERY_BROKER_URL: redis://redis:6379/0
  KARPWIKI_OPENSEARCH_URL: http://opensearch:9200
  KARPWIKI_LLM_CLASSIFIER_MODEL: ${KARPWIKI_LLM_CLASSIFIER_MODEL:-openai:gpt-5-nano}
  KARPWIKI_LLM_CURATOR_MODEL: ${KARPWIKI_LLM_CURATOR_MODEL:-openai:gpt-5-nano}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  # Maintenance Advisor scheduling (phase2-tasklist.md step 41) — read by `celery-beat`
  # (decides fire timing) and by `worker-maintenance` (decides the staleness traffic
  # tiers it applies); harmless on every other worker, same as e.g. KARPWIKI_OPENSEARCH_URL
  # already being in every worker's env regardless of whether that worker's queue uses it.
  KARPWIKI_MAINTENANCE_INTERVAL_HOURS: ${KARPWIKI_MAINTENANCE_INTERVAL_HOURS:-24}
  KARPWIKI_MAINTENANCE_CONTRADICTION_INTERVAL_HOURS: ${KARPWIKI_MAINTENANCE_CONTRADICTION_INTERVAL_HOURS:-168}
  KARPWIKI_STALENESS_HIGH_TRAFFIC_DAYS: ${KARPWIKI_STALENESS_HIGH_TRAFFIC_DAYS:-90}
  KARPWIKI_STALENESS_LOW_TRAFFIC_DAYS: ${KARPWIKI_STALENESS_LOW_TRAFFIC_DAYS:-365}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: karpwiki
      POSTGRES_PASSWORD: karpwiki
      POSTGRES_DB: karpwiki
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karpwiki"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    # No volume by design: Redis is only the Celery broker here (01 §1). Queued jobs
    # are re-derivable from raw_source.pipeline_state, which is in Postgres (09 §3).

  # Object Store (02 §2). MinIO rather than a host directory for two reasons: the raw
  # sources it holds are immutable originals that nothing can regenerate, so they need a
  # real volume; and it exercises the same s3:// path fsspec takes in a deployment
  # instead of a file:// path production never uses.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: karpwiki
      MINIO_ROOT_PASSWORD: karpwiki-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objectstore:/data

  # One-shot: create the bucket, then exit.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 karpwiki karpwiki-dev-secret; do sleep 1; done &&
      mc mb --ignore-existing local/karpwiki &&
      echo 'bucket ready'
      "

  # Dedicated Full-Text Index backend for large/isolated workspaces (02 §4, 08 §2's pick).
  # Single-node, security plugin disabled: this is a local dev/test convenience, not a
  # deployment topology recommendation — a real deployment terminates OpenSearch behind
  # its own auth the same way Phase 1 assumes the gateway sits behind one (09 §15).
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # Common Gateway (06 §5, phase2-tasklist.md step 49) — same image the four worker
  # services below share, just a different `command:`, matching that existing convention.
  # `expose`, not `ports`: scaled via `--scale gateway=N`, so a static host port mapping
  # would collide across replicas; only `nginx` below is reachable from the host.
  # Stateless by construction (rate-limit counters live in shared Redis, step 48; no
  # server-side HTTP session state anywhere), so any number of replicas can run behind
  # `nginx` with no session affinity.
  gateway:
    build: .
    image: karpwiki-worker:local
    command: uvicorn karpwiki.api:app --host 0.0.0.0 --port 8000
    environment: *worker-env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  # Round-robins across however many `gateway` replicas are up (nginx.conf) — the "Load
  # Balancer" box in 06 §4's diagram. Published on the host so a client talks to one
  # address regardless of replica count, same as a real deployment's LB VIP/DNS name.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - gateway

  # Worker pool per job type (06 §4, phase2-tasklist.md step 31) — one process group per
  # queue so classification/curation (LLM-bound) scale independently from indexing/
  # maintenance (compute-bound), per tasks.py's QUEUES. Only `worker-classification`
  # declares `build:`; the other three reuse the same tagged image rather than rebuilding
  # it three more times, since all four run the identical `Dockerfile`.
  worker-classification:
    build: .
    image: karpwiki-worker:local
    command: celery -A karpwiki.tasks worker -Q classification --loglevel=info -n classification@%h
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker-curation:
    image: karpwiki-worker:local
    command: celery -A karpwiki.tasks worker -Q curation --loglevel=info -n curation@%h
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker-indexing:
    image: karpwiki-worker:local
    command: celery -A karpwiki.tasks worker -Q indexing --loglevel=info -n indexing@%h
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  # Maintenance Advisor detectors (track 2c, steps 36-40): `detect_staleness`/
  # `detect_staleness_tiered`, `detect_superseded_sources`, `detect_existing_duplicates`,
  # `detect_orphans`, `detect_contradictions`. `celery-beat` below now schedules these
  # automatically (step 41) via the two `dispatch_*` tasks; the per-workspace tasks
  # themselves stay directly callable too, for manual/ad-hoc dispatch.
  worker-maintenance:
    image: karpwiki-worker:local
    command: celery -A karpwiki.tasks worker -Q maintenance --loglevel=info -n maintenance@%h
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Fires the two `dispatch_*` tasks above on a schedule (phase2-tasklist.md step 41, 05
  # §2's "scheduling philosophy") — exactly one `beat` process per deployment (Celery's own
  # requirement: a second one would double-fire every scheduled entry). Doesn't process any
  # queue itself, just enqueues; `worker-maintenance` (scaled independently, same as every
  # other queue per step 34) does the real work.
  celery-beat:
    image: karpwiki-worker:local
    # --schedule: beat's default persistence file lands in `/app` (the Dockerfile's
    # WORKDIR), owned by root from the image build — but the container runs as the
    # non-root `karpwiki` user (same Dockerfile), so the default path is not writable.
    # Caught live (a real PermissionError on first start, not assumed away) — /tmp is
    # writable by any user and losing this file on a container restart only means beat
    # re-derives "last run was never" for one schedule tick, not lost application state.
    command: celery -A karpwiki.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *worker-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  objectstore:
  opensearch-data:
