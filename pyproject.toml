[project]
name = "karpwiki"
version = "0.1.0"
description = "Enterprise Wiki Platform — reference implementation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "celery>=5.4",
    "redis>=5.0",
    "fsspec>=2024.6.0",
    "s3fs>=2024.6.0",
    "opensearch-py[async]>=2.6",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karpwiki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
